<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="ln" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 幾何学の背景（三角形のファセット） -->
  <g opacity=".13" fill="#fff">
    <polygon points="0,0 200,0 0,180"/>
    <polygon points="512,512 320,512 512,330"/>
    <polygon points="380,0 512,0 512,120"/>
    <polygon points="0,512 0,400 110,512"/>
  </g>
  <g fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2">
    <polygon points="256,60 430,160 430,360 256,460 82,360 82,160"/>
  </g>
  <!-- パレート：降順の柱（平行四辺形） -->
  <g fill="url(#b1)">
    <polygon points="116,396 116,206 166,184 166,396"/>
    <polygon points="184,396 184,262 234,240 234,396"/>
    <polygon points="252,396 252,302 302,280 302,396"/>
    <polygon points="320,396 320,334 370,312 370,396"/>
  </g>
  <!-- 累計の折れ線 -->
  <polyline points="141,190 209,138 277,112 345,100 400,96" fill="none" stroke="url(#ln)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#fb923c" stroke-width="7">
    <circle cx="141" cy="190" r="12"/><circle cx="277" cy="112" r="12"/><circle cx="400" cy="96" r="12"/>
  </g>
  <rect x="104" y="404" width="292" height="10" rx="5" fill="#fff" opacity=".85"/>
</svg>
